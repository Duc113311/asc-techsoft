name: Deploy to VPS

on:
  workflow_dispatch:
    inputs:
      deploy_password:
        description: 'Deploy password'
        required: true
        type: string

jobs:
  verify-password:
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy password
        run: |
          if [ "${{ github.event.inputs.deploy_password }}" != "${{ secrets.DEPLOY_PASSWORD }}" ]; then
            echo "❌ Wrong password. Deploy blocked."
            exit 1
          fi
          echo "✅ Password correct. Proceeding..."

  deploy:
    runs-on: ubuntu-latest
    needs: verify-password
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: 'dist/*'
          target: '/var/www/asctechsoft.com'
          strip_components: 1

      - name: Reload nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: systemctl reload nginx

      - name: Done
        run: echo "✅ Deployed to https://asctechsoft.com"
